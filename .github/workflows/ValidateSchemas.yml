name: Validate JSON schemas

on:
  push:
    paths:
      - "test/data/**"
      - ".github/workflows/ValidateSchemas.yml"
  pull_request:
    paths:
      - "test/data/**"
      - ".github/workflows/ValidateSchemas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate bundled rule fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OpenSymbolicRules/Specification
          path: specification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install check-jsonschema==0.38.0
      - run: check-jsonschema --check-metaschema specification/schemas/*.schema.json
      - name: Validate bundled rule fixtures
        run: find test/data -name '*.json' ! -name meta.json ! -path '*/inferences/*' ! -path '*/osr1/*' -print0 | xargs -0 check-jsonschema --schemafile specification/schemas/rule-file.schema.json --base-uri "file://${PWD}/specification/schemas/"
      - name: Validate OSR v1 fixtures
        # v1 schemas from OpenSymbolicRules/Specification, pinned by commit
        # (the `specification` submodule still pins a v0.1 revision).
        env:
          SPEC: https://raw.githubusercontent.com/OpenSymbolicRules/Specification/3426eedd329fa7bd696104359aa8e994a6c09194/schemas/v1
        run: |
          curl -sSfL "$SPEC/ruleset.schema.json" -o /tmp/ruleset.schema.json
          curl -sSfL "$SPEC/conformance.schema.json" -o /tmp/conformance.schema.json
          check-jsonschema --schemafile /tmp/ruleset.schema.json test/data/osr1/*.osr.json
          check-jsonschema --schemafile /tmp/conformance.schema.json test/data/osr1/conformance/*.cases.json
      - name: Validate bundled profile manifests
        run: find test/data -name meta.json -print0 | xargs -0 check-jsonschema --schemafile specification/schemas/meta.schema.json --base-uri "file://${PWD}/specification/schemas/"
      - name: Validate bundled inference profiles
        run: find test/data -path '*/inferences/*.json' -print0 | xargs -0 check-jsonschema --schemafile specification/schemas/inference-file.schema.json --base-uri "file://${PWD}/specification/schemas/"
